<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Ranking</title>

<style>
body{
  font-family: Arial;
  background:#111;
  color:white;
  padding:20px;
}

/* BOTÃO SAIR */
.sair{
  position:fixed;
  top:12px;
  right:12px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:red;
  color:white;
  border:none;
  font-size:18px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 0 10px rgba(255,0,0,0.6);
  z-index:9999;
}

/* PREVIEW FOTO */
.preview-box{
  position:relative;
  width:120px;
  height:120px;
  margin-top:10px;
}

.preview-box img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid gold;
  display:none;
}

.remover{
  position:absolute;
  top:-5px;
  right:-5px;
  width:25px;
  height:25px;
  border-radius:50%;
  background:black;
  color:red;
  border:1px solid red;
  font-weight:bold;
  cursor:pointer;
  display:none;
}
</style>
</head>

<body>

<button class="sair" onclick="alert('Saindo...')">×</button>

<h2>⚙️ Painel do Ranking</h2>

<hr>

<h3>🥇 Líder</h3>

<label>Nome:</label><br>
<input id="liderNome" style="width:100%;padding:8px"><br><br>

<label>Valor:</label><br>
<input id="liderValor" style="width:100%;padding:8px"><br><br>

<label>Link da foto:</label><br>
<input id="liderFoto" style="width:100%;padding:8px"><br>

<div class="preview-box">
  <img id="previewFoto">
  <button class="remover" id="btnRemoverFoto">×</button>
</div>

<hr>

<h3>🥈 Segundo lugar</h3>

<label>Nome:</label><br>
<input id="segNome" style="width:100%;padding:8px"><br><br>

<label>Valor:</label><br>
<input id="segValor" style="width:100%;padding:8px"><br><br>

<hr>

<h3>🥉 Terceiro lugar</h3>

<label>Nome:</label><br>
<input id="terNome" style="width:100%;padding:8px"><br><br>

<label>Valor:</label><br>
<input id="terValor" style="width:100%;padding:8px"><br><br>

<hr>

<button onclick="salvar()" style="padding:12px 20px;font-weight:bold;">
Salvar Ranking
</button>

<script>
const inputFoto = document.getElementById("liderFoto");
const preview = document.getElementById("previewFoto");
const btnRemover = document.getElementById("btnRemoverFoto");

inputFoto.addEventListener("input", atualizarFoto);

function atualizarFoto(){
  const url = inputFoto.value.trim();

  if(url){
    preview.src = url;
    preview.style.display = "block";
    btnRemover.style.display = "block";
  } else {
    removerFoto();
  }
}

btnRemover.addEventListener("click", removerFoto);

function removerFoto(){
  inputFoto.value = "";
  preview.src = "";
  preview.style.display = "none";
  btnRemover.style.display = "none";
}

function salvar(){

  const ranking = {
    lider: {
      nome: document.getElementById("liderNome").value,
      valor: document.getElementById("liderValor").value,
      foto: document.getElementById("liderFoto").value
    },
    segundo: {
      nome: document.getElementById("segNome").value,
      valor: document.getElementById("segValor").value
    },
    terceiro: {
      nome: document.getElementById("terNome").value,
      valor: document.getElementById("terValor").value
    }
  };

  localStorage.setItem("ranking", JSON.stringify(ranking));

  alert("Ranking salvo com sucesso!");
}
</script>

</body>
</html>
