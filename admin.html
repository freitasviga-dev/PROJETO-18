<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sistema Anti-Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Painel Admin</title>
    
    <style>
        /* Estilos baseados no seu design escuro */
        body { 
            background-color: #111; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        h1 { color: #facc15; }
        
        /* Tela de Bloqueio (Senha) */
        #loginScreen { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #111; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }

        .card { 
            background: #1a1a1a; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            text-align: left; 
        }
        
        .gold-border { 
            border: 1px solid #facc15; 
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input { 
            background: #000; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 16px;
        }

        /* Estilo específico para o botão de arquivo (Galeria) */
        input[type="file"] { 
            padding: 10px;
            background: #222;
            color: #ccc;
            cursor: pointer;
        }

        button { 
            background: #facc15; 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Tela de Autenticação -->
    <div id="loginScreen">
        <h2>Acesso Restrito</h2>
        <div style="width: 80%; max-width: 300px;">
            <input type="password" id="senhaInput" placeholder="Digite a senha">
            <button onclick="verificarSenha()">Entrar no Painel</button>
        </div>
    </div>

    <!-- Painel Principal (Oculto até a senha estar certa) -->
    <div id="adminPanel" style="display: none;">
        <h1>👑 PAINEL ADMIN</h1>
        <p>Atualize o pódio em tempo real.</p>

        <div class="card gold-border">
            <h3>🥇 1º Lugar (Eternizado com Foto)</h3>
            <div class="input-group">
                <input type="text" id="nome1" placeholder="Nome" value="Verinha">
                <input type="text" id="valor1" placeholder="R$ 100,00" value="R$ 100,00">
            </div>
            
            <!-- Aqui volta a ser o botão de escolher da galeria -->
            <input type="file" id="fotoLider" accept="image/*" onchange="converterParaBase64(this)">
            
            <!-- Input invisível que guarda o código Base64 gigante gerado pela foto -->
            <input type="hidden" id="fotoBase64Oculta"> 
        </div>

        <div class="card">
            <h3>🥈 2º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome2" value="Verônica">
                <input type="text" id="valor2" value="R$ 100,00">
            </div>
        </div>

        <div class="card">
            <h3>🥉 3º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome3" value="Paula Lacerda">
                <input type="text" id="valor3" value="R$ 50,00">
            </div>
        </div>

        <button onclick="salvarAlteracoes()">Atualizar Ranking</button>
    </div>

    <script>
        // 1. Função da Senha
        function verificarSenha() {
            const senhaDigitada = document.getElementById('senhaInput').value;
            const senhaCorreta = '1234'; // Mude isso para a sua senha real
            
            if(senhaDigitada === senhaCorreta) { 
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('Senha incorreta! Tente novamente.');
            }
        }

        // 2. Função que converte a foto da galeria para o código Base64 invisível
        function converterParaBase64(inputElement) {
            const arquivo = inputElement.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(evento) {
                    // Joga o código gigante para o input oculto, mantendo o visual limpo
                    document.getElementById('fotoBase64Oculta').value = evento.target.result;
                };
                leitor.readAsDataURL(arquivo);
            }
        }

        // 3. Função para salvar
        function salvarAlteracoes() {
            // Pegar os valores para salvar (nome, valor, e a imagem convertida)
            const fotoSalvaBase64 = document.getElementById('fotoBase64Oculta').value;
            
            // Aqui você integra com a lógica que já usava para enviar pro servidor/banco
            alert('Dados prontos para atualizar!');
        }
    </script>
</body>
</html>
