<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Trava de zoom automático e escala (Previne o zoom ao clicar nos inputs) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Sistema Anti-Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Painel Admin PRO</title>
    
    <style>
        /* Fundo com gradiente suave para dar profundidade */
        body { 
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            color: #ffffff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 15px; /* Reduzido para encaixar melhor no mobile */
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        h1 { 
            color: #facc15; 
            text-shadow: 0 4px 10px rgba(250, 204, 21, 0.3);
            font-size: 26px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        p { color: #aaaaaa; margin-bottom: 25px; font-size: 15px; }
        
        /* Tela de Bloqueio (Senha) com efeito Blur */
        #loginScreen { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(18, 18, 18, 0.95); 
            backdrop-filter: blur(5px);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }

        /* Efeito 3D nos Cards (Neumorphism escuro) */
        .card { 
            background: #1a1a1a; 
            padding: 20px 15px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            text-align: left; 
            box-shadow: 6px 6px 12px #0d0d0d, -6px -6px 12px #272727;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* Destaque para o 1º Lugar */
        .gold-border { 
            border: 1px solid rgba(250, 204, 21, 0.5); 
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.15), 6px 6px 12px #0d0d0d, -6px -6px 12px #272727;
        }

        h3 { margin-top: 0; color: #eeeeee; font-size: 17px; margin-bottom: 12px; }
        .gold-border h3 { color: #facc15; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* Inputs com profundidade interna */
        input[type="text"], input[type="password"] { 
            background: #121212; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 14px; 
            border-radius: 10px; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 16px; /* TAMANHO 16PX É OBRIGATÓRIO PARA NÃO DAR ZOOM NO IPHONE/ANDROID */
            box-shadow: inset 3px 3px 6px #070707, inset -3px -3px 6px #1d1d1d;
            transition: border 0.3s ease;
            -webkit-appearance: none;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #facc15;
        }

        /* Estilo Profissional para o Upload de Arquivo */
        input[type="file"] { display: none; } 

        .custom-upload-btn {
            display: block;
            background: #2a2a2a;
            color: #facc15;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #facc15;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s;
        }

        .custom-upload-btn:hover { background: #333; }

        /* Container da Imagem de Preview */
        #previewContainer {
            position: relative;
            display: none; 
            margin-top: 15px;
            width: 120px;
            height: 120px;
            border-radius: 12px;
            border: 2px solid #facc15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background-size: cover;
            background-position: center;
        }

        /* Botão X Vermelho com Efeito 3D */
        .btn-remover {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(145deg, #ff4d4d, #cc0000);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .btn-remover:hover { transform: scale(1.1); }

        /* Botão Principal com Efeito 3D Pressionável */
        .btn-primary { 
            background: linear-gradient(145deg, #fce04b, #dfb30b); 
            color: #000; 
            border: none; 
            padding: 16px 20px; 
            border-radius: 12px; 
            font-weight: 900; 
            font-size: 17px;
            cursor: pointer; 
            width: 100%;
            margin-top: 5px;
            margin-bottom: 40px;
            box-shadow: 0 6px 0 #b38f00, 0 10px 15px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            text-transform: uppercase;
        }

        .btn-primary:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #b38f00, 0 4px 6px rgba(0,0,0,0.4);
        }

    </style>
</head>
<body>

    <!-- Tela de Autenticação -->
    <div id="loginScreen">
        <h2 style="color: #facc15; margin-bottom: 20px;">ACESSO RESTRITO</h2>
        <div style="width: 85%; max-width: 320px;">
            <input type="password" id="senhaInput" placeholder="Digite a senha admin" style="margin-bottom: 20px; text-align: center;">
            <button class="btn-primary" style="margin-bottom: 0;" onclick="verificarSenha()">ENTRAR NO PAINEL</button>
        </div>
    </div>

    <!-- Painel Principal (Ajustado para Tela Cheia Mobile) -->
    <div id="adminPanel" style="display: none; width: 100%; max-width: 600px; margin: 0 auto;">
        <h1>👑 PAINEL ADMIN</h1>
        <p>Edite os valores e clique fora do campo para formatar.</p>

        <!-- 1º LUGAR -->
        <div class="card gold-border">
            <h3>🥇 1º Lugar (Eternizado com Foto)</h3>
            <div class="input-group">
                <input type="text" id="nome1" placeholder="Nome">
                <input type="text" id="valor1" placeholder="R$ 0,00" class="input-valor">
            </div>
            
            <label for="fotoLider" class="custom-upload-btn" id="labelUpload">
                📷 Escolher Foto da Galeria
            </label>
            <input type="file" id="fotoLider" accept="image/*" onchange="mostrarPreview(this)">
            
            <div id="previewContainer">
                <button class="btn-remover" onclick="removerFoto()">X</button>
            </div>
            
            <input type="hidden" id="fotoBase64Oculta"> 
        </div>

        <!-- 2º LUGAR -->
        <div class="card">
            <h3>🥈 2º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome2" placeholder="Nome">
                <input type="text" id="valor2" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 3º LUGAR -->
        <div class="card">
            <h3>🥉 3º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome3" placeholder="Nome">
                <input type="text" id="valor3" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 4º LUGAR -->
        <div class="card">
            <h3>🏅 4º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome4" placeholder="Nome">
                <input type="text" id="valor4" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 5º LUGAR -->
        <div class="card">
            <h3>🏅 5º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome5" placeholder="Nome">
                <input type="text" id="valor5" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 6º LUGAR -->
        <div class="card">
            <h3>🏅 6º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome6" placeholder="Nome">
                <input type="text" id="valor6" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 7º LUGAR -->
        <div class="card">
            <h3>🏅 7º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome7" placeholder="Nome">
                <input type="text" id="valor7" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 8º LUGAR -->
        <div class="card">
            <h3>🏅 8º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome8" placeholder="Nome">
                <input type="text" id="valor8" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 9º LUGAR -->
        <div class="card">
            <h3>🏅 9º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome9" placeholder="Nome">
                <input type="text" id="valor9" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <!-- 10º LUGAR -->
        <div class="card">
            <h3>🏅 10º Lugar</h3>
            <div class="input-group">
                <input type="text" id="nome10" placeholder="Nome">
                <input type="text" id="valor10" placeholder="R$ 0,00" class="input-valor">
            </div>
        </div>

        <button id="btnSalvar" class="btn-primary" onclick="salvarAlteracoes()">Atualizar Ranking ✅</button>
    </div>

    <!-- MÁSCARA INTELIGENTE DE DINHEIRO -->
    <script>
        window.formatarMoeda = function(input) {
            let val = input.value.trim();
            if (!val) return;
            
            // Pega apenas números, vírgula e ponto
            let numeros = val.replace(/[^\d.,]/g, '');
            if (numeros === '') { input.value = ''; return; }

            // Se digitou só número (ex: 10), bota a vírgula
            if (!numeros.includes(',') && !numeros.includes('.')) {
                numeros += ',00';
            } else if (numeros.includes('.') && !numeros.includes(',')) {
                // Se digitou ponto (ex: 10.50), transforma em vírgula
                numeros = numeros.replace('.', ',');
            }

            // Tira pontos excedentes (caso alguém digite ponto de milhar manual)
            numeros = numeros.replace(/\./g, '');
            
            let partes = numeros.split(',');
            let inteiro = partes[0] || '0';
            let decimal = partes[1] || '';

            // Garante 2 casas decimais exatas
            if (decimal.length === 0) decimal = '00';
            else if (decimal.length === 1) decimal += '0';
            else if (decimal.length > 2) decimal = decimal.substring(0, 2);

            // Adiciona ponto de milhar (Ex: 1.000,00)
            inteiro = inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

            // Joga formatado pro input
            input.value = `R$ ${inteiro},${decimal}`;
        }

        // Adiciona a máscara a todos os campos de valor após carregamento
        document.addEventListener('DOMContentLoaded', () => {
            const inputsValor = document.querySelectorAll('.input-valor');
            inputsValor.forEach(input => {
                // Quando clicar fora ou mudar de campo, aplica a formatação
                input.addEventListener('blur', function() {
                    window.formatarMoeda(this);
                });
            });
        });
    </script>

    <!-- FIREBASE E LÓGICA DO ADMIN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLl0PxicnE9Hdio-dREwtiN-06YfKalPA",
            authDomain: "projeto-18-14723.firebaseapp.com",
            databaseURL: "https://projeto-18-14723-default-rtdb.firebaseio.com",
            projectId: "projeto-18-14723",
            storageBucket: "projeto-18-14723.firebasestorage.app",
            messagingSenderId: "159188137463",
            appId: "1:159188137463:web:4787318803107e001f2af2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const rankingRef = ref(db, 'ranking');

        window.verificarSenha = function() {
            const senhaDigitada = document.getElementById('senhaInput').value;
            const senhaCorreta = '1234'; 
            
            if(senhaDigitada === senhaCorreta) { 
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                
                get(rankingRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        
                        if(data.lider) {
                            document.getElementById('nome1').value = data.lider.nome || "";
                            document.getElementById('valor1').value = data.lider.valor || "";
                            if(data.lider.foto) {
                                document.getElementById('fotoBase64Oculta').value = data.lider.foto;
                                const previewBox = document.getElementById('previewContainer');
                                previewBox.style.backgroundImage = `url(${data.lider.foto})`;
                                previewBox.style.display = 'block';
                                document.getElementById('labelUpload').style.display = 'none';
                            }
                        }
                        
                        const maps = [
                            { key: 'segundo', num: 2 }, { key: 'terceiro', num: 3 }, { key: 'quarto', num: 4 },
                            { key: 'quinto', num: 5 }, { key: 'sexto', num: 6 }, { key: 'setimo', num: 7 },
                            { key: 'oitavo', num: 8 }, { key: 'nono', num: 9 }, { key: 'decimo', num: 10 }
                        ];

                        maps.forEach(pos => {
                            if(data[pos.key]) {
                                document.getElementById(`nome${pos.num}`).value = data[pos.key].nome || "";
                                document.getElementById(`valor${pos.num}`).value = data[pos.key].valor || "";
                            }
                        });
                    }
                });
            } else {
                alert('Senha incorreta!');
            }
        }

        window.mostrarPreview = function(inputElement) {
            const arquivo = inputElement.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(evento) {
                    const resultadoBase64 = evento.target.result;
                    document.getElementById('fotoBase64Oculta').value = resultadoBase64;
                    
                    const previewBox = document.getElementById('previewContainer');
                    previewBox.style.backgroundImage = `url(${resultadoBase64})`;
                    previewBox.style.display = 'block';
                    document.getElementById('labelUpload').style.display = 'none';
                };
                leitor.readAsDataURL(arquivo);
            }
        }

        window.removerFoto = function() {
            document.getElementById('fotoLider').value = '';
            document.getElementById('fotoBase64Oculta').value = '';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('previewContainer').style.backgroundImage = 'none';
            document.getElementById('labelUpload').style.display = 'block';
        }

        window.salvarAlteracoes = function() {
            const btn = document.getElementById('btnSalvar');
            btn.textContent = "Salvando... ⏳";

            // Aplica a formatação final em todos os campos antes de enviar para garantir o formato correto no banco
            const inputsValor = document.querySelectorAll('.input-valor');
            inputsValor.forEach(input => window.formatarMoeda(input));

            const payload = {
                lider: {
                    nome: document.getElementById('nome1').value,
                    valor: document.getElementById('valor1').value,
                    foto: document.getElementById('fotoBase64Oculta').value
                },
                segundo: { nome: document.getElementById('nome2').value, valor: document.getElementById('valor2').value },
                terceiro: { nome: document.getElementById('nome3').value, valor: document.getElementById('valor3').value },
                quarto: { nome: document.getElementById('nome4').value, valor: document.getElementById('valor4').value },
                quinto: { nome: document.getElementById('nome5').value, valor: document.getElementById('valor5').value },
                sexto: { nome: document.getElementById('nome6').value, valor: document.getElementById('valor6').value },
                setimo: { nome: document.getElementById('nome7').value, valor: document.getElementById('valor7').value },
                oitavo: { nome: document.getElementById('nome8').value, valor: document.getElementById('valor8').value },
                nono: { nome: document.getElementById('nome9').value, valor: document.getElementById('valor9').value },
                decimo: { nome: document.getElementById('nome10').value, valor: document.getElementById('valor10').value }
            };

            set(rankingRef, payload).then(() => {
                btn.textContent = "Atualizado com Sucesso! ✅";
                setTimeout(() => { btn.textContent = "Atualizar Ranking ✅"; }, 3000);
            }).catch((error) => {
                alert("Erro ao salvar: " + error);
                btn.textContent = "Atualizar Ranking ✅";
            });
        }
    </script>
</body>
