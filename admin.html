<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Projeto 18</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: gold; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Painel de Controle</h2>
    <p>Atualizar Posição:</p>
    <select id="posicao">
        <option value="lider">1º Lugar (Líder)</option>
        <option value="segundo">2º Lugar</option>
        <option value="terceiro">3º Lugar</option>
    </select>
    <input type="text" id="nome" placeholder="Nome do apoiador">
    <input type="text" id="valor" placeholder="Valor (ex: R$ 50,00)">
    <button onclick="atualizarRanking()">Atualizar Ranking</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCLl0PxicnE9Hdio-dREwtiN-06YfKalPA",
        databaseURL: "https://projeto-18-14723-default-rtdb.firebaseio.com",
        projectId: "projeto-18-14723"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.atualizarRanking = function() {
        const pos = document.getElementById("posicao").value;
        const nome = document.getElementById("nome").value;
        const valor = document.getElementById("valor").value;

        set(ref(db, 'ranking/' + pos), {
            nome: nome,
            valor: valor
        }).then(() => {
            alert("Ranking atualizado com sucesso!");
        }).catch((error) => {
            alert("Erro: " + error.message);
        });
    }
</script>
</body>
</html>
