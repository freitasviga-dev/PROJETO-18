<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Painel Admin Ranking</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

/* LOGIN */
#loginScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at top, #111, #000);
  z-index:9999;
}

.loginBox{
  width:90%;
  max-width:320px;
  text-align:center;
  padding:25px;
  background:rgba(0,0,0,0.85);
  border:2px solid gold;
  border-radius:15px;
  box-shadow:0 0 30px gold;
}

.loginBox h2{ color:gold; }

.senhaBox{
  position:relative;
  margin-bottom: 15px;
}

.senhaBox input{
  width:100%;
  padding:10px;
  border-radius:8px;
  text-align:center;
  box-sizing: border-box;
}

.senhaBox span{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color: #000;
}

.loginBox button {
  background: gold;
  color: black;
  border: none;
  padding: 10px 20px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
}

/* PAINEL */
#painel{
  display:none;
  padding:20px;
  max-width:700px;
  margin:auto;
}

h2{
  text-align:center;
  color:gold;
}

.section{
  background:#111;
  border:1px solid gold;
  padding:15px;
  border-radius:10px;
  margin:15px auto;
  max-width:500px;
}

.section h3{
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:6px;
  border:none;
  box-sizing: border-box;
}

.section button {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  background: gold;
  color: black;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* BOTÃO SAIR */
#logout{
  position:fixed;
  top:10px;
  right:10px;
  width:55px;
  height:28px;
  font-size:11px;
  background:red;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  z-index:9999;
}

/* CONTAINER DA FOTO CENTRALIZADO (NOME NOVO ANTICACHE) */
.area-foto{
  margin-top:15px;
  display: block;
  position: relative;
  width: 170px;  
  height: 170px; 
  margin-left: auto;
  margin-right: auto;
}

.area-foto img{
  width: 170px;
  height: 170px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid gold;
  box-shadow: 0 0 25px gold;
  display: block;
}

/* O "X" PERFEITO: MENOR, MAIS PRA DIREITA E COM BORDA BRANCA (NOME NOVO ANTICACHE) */
.botao-fechar{
  position: absolute;
  top: -5px;       /* Deslocado para cima */
  right: -12px;    /* Deslocado bem mais para a direita, fora do círculo */
  width: 25px;     /* Tamanho menor e discreto */
  height: 25px;
  background: #cc0000 !important; /* Força o vermelho vivo */
  color: #ffffff !important;    /* Força o X branco */
  font-weight: bold;
  font-size: 13px;
  font-family: Arial, sans-serif;
  border: 1.5px solid #ffffff !important; /* Bordinha branca nítida do seu exemplo */
  border-radius: 50%;     
  cursor: pointer;
  display: flex !important;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
  z-index: 9999 !important; /* Fica acima de tudo sem erro */
  padding: 0;
  margin: 0;
}
</style>
</head>

<body>

<div id="loginScreen">
  <div class="loginBox">
    <h2>⚙️ PAINEL ADMIN</h2>

    <div class="senhaBox">
      <input type="password" id="senha" placeholder="Senha">
      <span onclick="toggleSenha()">👁️</span>
    </div>

    <button onclick="entrar()">Entrar</button>
  </div>
</div>

<div id="painel">

<button id="logout" onclick="sair()">Sair</button>

<h2>⚙️ Painel Ranking</h2>

<div class="section">
<h3>🥇 Líder</h3>
<input id="l_nome" placeholder="Nome">
<input id="l_valor" placeholder="Valor">
<input type="file" id="l_foto" style="color: white; margin-top: 10px;">
<div class="area-foto" id="prev"></div> <button onclick="salvarLider()">Salvar Líder</button>
</div>

<div class="section">
<h3>🥈 Segundo</h3>
<input id="s_nome" placeholder="Nome">
<input id="s_valor" placeholder="Valor">
<button onclick="salvarSegundo()">Salvar Segundo</button>
</div>

<div class="section">
<h3>🥉 Terceiro</h3>
<input id="t_nome" placeholder="Nome">
<input id="t_valor" placeholder="Valor">
<button onclick="salvarTerceiro()">Salvar Terceiro</button>
</div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCLl0PxicnE9Hdio-dREwtiN-06YfKalPA",
    authDomain: "projeto-18-14723.firebaseapp.com",
    databaseURL: "https://projeto-18-14723-default-rtdb.firebaseio.com",
    projectId: "projeto-18-14723",
    storageBucket: "projeto-18-14723.firebasestorage.app",
    messagingSenderId: "159188137463",
    appId: "1:159188137463:web:4787318803107e001f2af2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let fotoBase64 = "";

  function carregarDadosAtuais() {
    const rankingRef = ref(db, 'ranking');
    onValue(rankingRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.lider) {
          document.getElementById("l_nome").value = data.lider.nome || "";
          document.getElementById("l_valor").value = data.lider.valor || "";
          if (data.lider.foto) {
            fotoBase64 = data.lider.foto;
            // Atualizado com a classe anticache nova
            document.getElementById("prev").innerHTML = `
              <img src="${fotoBase64}">
              <button class="botao-fechar" type="button" id="btnRemoveFoto">X</button>
            `;
            document.getElementById("btnRemoveFoto").onclick = removerFoto;
          }
        }
        if (data.segundo) {
          document.getElementById("s_nome").value = data.segundo.nome || "";
          document.getElementById("s_valor").value = data.segundo.valor || "";
        }
        if (data.terceiro) {
          document.getElementById("t_nome").value = data.terceiro.nome || "";
          document.getElementById("t_valor").value = data.terceiro.valor || "";
        }
      }
    });
  }

  window.salvarLider = function() {
    const nome = document.getElementById("l_nome").value;
    const valor = document.getElementById("l_valor").value;

    set(ref(db, 'ranking/lider'), {
      nome: nome,
      valor: valor,
      foto: fotoBase64
    })
    .then(() => alert("🥇 Líder salvo com sucesso no Firebase!"))
    .catch((error) => alert("Erro ao salvar: " + error.message));
  }

  window.salvarSegundo = function() {
    const nome = document.getElementById("s_nome").value;
    const valor = document.getElementById("s_valor").value;

    set(ref(db, 'ranking/segundo'), {
      nome: nome,
      valor: valor
    })
    .then(() => alert("🥈 Segundo lugar salvo com sucesso no Firebase!"))
    .catch((error) => alert("Erro ao salvar: " + error.message));
  }

  window.salvarTerceiro = function() {
    const nome = document.getElementById("t_nome").value;
    const valor = document.getElementById("t_valor").value;

    set(ref(db, 'ranking/terceiro'), {
      nome: nome,
      valor: valor
    })
    .then(() => alert("🥉 Terceiro lugar salvo com sucesso no Firebase!"))
    .catch((error) => alert("Erro ao salvar: " + error.message));
  }

  document.getElementById("l_foto").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = () => {
      fotoBase64 = reader.result;
      // Atualizado com a classe anticache nova
      document.getElementById("prev").innerHTML = `
        <img src="${fotoBase64}">
        <button class="botao-fechar" type="button" id="btnRemoveFoto">X</button>
      `;
      document.getElementById("btnRemoveFoto").onclick = removerFoto;
    };
    reader.readAsDataURL(file);
  });

  window.removerFoto = function() {
    fotoBase64 = "";
    document.getElementById("prev").innerHTML = "";
    document.getElementById("l_foto").value = "";
  }

  window.entrar = function() {
    if(document.getElementById("senha").value === "Vittor262200"){
      document.getElementById("loginScreen").style.display="none";
      document.getElementById("painel").style.display="block";
      carregarDadosAtuais();
    }else{
      alert("Senha incorreta!");
    }
  }
</script>

<script>
function toggleSenha(){
  const i=document.getElementById("senha");
  i.type=i.type==="password"?"text":"password";
}

function sair(){
  location.reload();
}
</script>

</body>
</html>
