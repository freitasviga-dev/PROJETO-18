<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto 18 - Maioridade</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle at top, #1a1a1a, #000);
  font-family:Arial, sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
}

.container{
  max-width:500px;
  margin:auto;
  padding:35px 20px;
}

/* PARTÍCULAS */
.particula{
  position:fixed;
  width:4px;
  height:4px;
  background:gold;
  border-radius:50%;
  opacity:0.6;
  animation:flutuar 12s linear infinite;
}
@keyframes flutuar{
  from{ transform:translateY(100vh); }
  to{ transform:translateY(-10vh); }
}

/* FOTO */
@keyframes glowFoto{
  0%{ box-shadow:0 0 20px gold; }
  50%{ box-shadow:0 0 50px gold; }
  100%{ box-shadow:0 0 20px gold; }
}
.foto{
  width:220px;
  height:220px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid gold;
  animation:glowFoto 3s infinite;
}

/* TÍTULO */
@keyframes brilhoTitulo{
  0%{ text-shadow:0 0 5px gold; }
  50%{ text-shadow:0 0 30px gold; }
  100%{ text-shadow:0 0 5px gold; }
}
h1{
  color:gold;
  font-size:34px;
  margin-top:25px;
  animation:brilhoTitulo 2.5s infinite;
}

/* TEXTO */
.texto{
  margin-top:20px;
  line-height:1.7;
  font-size:17px;
  color:#ddd;
}

/* CARD */
.card{
  background:rgba(0,0,0,0.65);
  border:2px solid gold;
  border-radius:18px;
  padding:22px;
  margin-top:28px;
  box-shadow:0 0 30px rgba(255,215,0,0.2);
}

/* CONTADOR */
#contador{
  font-size:20px;
  color:gold;
  font-weight:bold;
}

/* BOTÃO PIX */
button{
  background:gold;
  border:none;
  padding:14px 30px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}
button:active{ transform:scale(0.95); }

/* QR */
.qr{
  width:220px;
  margin-top:20px;
  border-radius:12px;
  box-shadow:0 0 25px gold;
}
</style>
</head>

<body>

<script>
for(let i=0;i<25;i++){
  const p=document.createElement("div");
  p.className="particula";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDelay=Math.random()*10+"s";
  document.body.appendChild(p);
}
</script>

<div class="container">

<img class="foto" src="minha-foto.jpg" alt="Foto">

<h1>PROJETO 18 –<br>MAIORIDADE</h1>

<div class="texto">
Mesmo que você esteja longe e não possamos comemorar juntos,
sua presença ainda pode fazer parte desse momento tão especial 💛
</div>

<div class="card">
🎂 <strong>22 de Julho de 2026</strong>
<br><br>
<div id="contador"></div>
</div>

<div class="card">
💸 <strong>Pix para contribuição</strong>
<br><br>
<button onclick="copiar()">Copiar chave Pix</button>
<br><br>
<img class="qr" src="qrcode.png" alt="QR Code Pix">
</div>

</div>

<script>
function copiar(){
  navigator.clipboard.writeText("83996721410")
  .then(()=>alert("Chave Pix copiada!"));
}

const aniversario = new Date("2026-07-22T00:00:00").getTime();
setInterval(()=>{
  const agora = new Date().getTime();
  const d = aniversario - agora;
  document.getElementById("contador").innerHTML =
    d <= 0 ? "🎉 18 ANOS CHEGOU!" :
    Math.floor(d/86400000)+" dias "+
    Math.floor((d%86400000)/3600000)+"h "+
    Math.floor((d%3600000)/60000)+"m "+
    Math.floor((d%60000)/1000)+"s";
},1000);
</script>

<!-- FLUTUANTE -->
<script src="flutuante.js"></script>

</body>
</html>
