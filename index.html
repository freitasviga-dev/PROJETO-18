<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto 18 - Maioridade</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle at top, #1a1a1a, #000);
  font-family:Arial, sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
}

.container{
  max-width:500px;
  margin:auto;
  padding:35px 20px;
}

/* PARTÍCULAS */
.particula{
  position:fixed;
  width:4px;
  height:4px;
  background:gold;
  border-radius:50%;
  opacity:0.6;
  animation:flutuar 12s linear infinite;
}
@keyframes flutuar{
  from{ transform:translateY(100vh); }
  to{ transform:translateY(-10vh); }
}

/* FOTO */
@keyframes glowFoto{
  0%{ box-shadow:0 0 20px gold; }
  50%{ box-shadow:0 0 50px gold; }
  100%{ box-shadow:0 0 20px gold; }
}
.foto{
  width:220px;
  height:220px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid gold;
  animation:glowFoto 3s infinite;
}

/* TÍTULO */
@keyframes brilhoTitulo{
  0%{ text-shadow:0 0 5px gold; }
  50%{ text-shadow:0 0 30px gold; }
  100%{ text-shadow:0 0 5px gold; }
}
h1{
  color:gold;
  font-size:34px;
  margin-top:25px;
  animation:brilhoTitulo 2.5s infinite;
}

/* TEXTO */
.texto{
  margin-top:20px;
  line-height:1.7;
  font-size:17px;
  color:#ddd;
}

/* CARD */
.card{
  background:rgba(0,0,0,0.65);
  border:2px solid gold;
  border-radius:18px;
  padding:22px;
  margin-top:28px;
  box-shadow:0 0 30px rgba(255,215,0,0.2);
}

/* CONTADOR */
#contador{
  font-size:20px;
  color:gold;
  font-weight:bold;
}

/* PIX */
.pix-numero{
  font-size:20px;
  margin:15px 0;
}

/* BOTÃO PADRÃO */
@keyframes pulsarBotao{
  0%{ box-shadow:0 0 10px gold; }
  50%{ box-shadow:0 0 35px gold; }
  100%{ box-shadow:0 0 10px gold; }
}
button{
  background:gold;
  border:none;
  padding:14px 30px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  animation:pulsarBotao 2s infinite;
}
button:active{ transform:scale(0.95); }

/* QR */
.qr{
  width:220px;
  margin-top:20px;
  border-radius:12px;
  box-shadow:0 0 25px gold;
}

/* TABELA */
.tabela{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
.tabela th, .tabela td{
  border:1px solid gold;
  padding:12px;
  white-space:nowrap;
  vertical-align:middle;
  height:55px;
}
.tabela th{
  background:#111;
  color:gold;
}

/* DESTAQUE */
@keyframes vip{
  0%{ background:#1a1a1a; box-shadow:0 0 10px gold; transform:scale(1); }
  50%{ background:#2a2a2a; box-shadow:0 0 45px gold; transform:scale(1.07); }
  100%{ background:#1a1a1a; box-shadow:0 0 10px gold; transform:scale(1); }
}
.destaque{
  font-weight:bold;
  animation:vip 1.2s infinite;
  position:relative;
}
.destaque::after{
  content:"🥇 TOP APOIADOR";
  position:absolute;
  top:-12px;
  right:-10px;
  background:gold;
  color:black;
  font-size:10px;
  padding:3px 6px;
  border-radius:6px;
}

/* RANKING */
.rank-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid gold;
  background:#111;
}

.lider{
  position:relative;
  padding-left:90px;
  min-height:70px;
}
.lider::after{
  content:"🔥 Líder atual";
  position:absolute;
  top:-14px;
  right:-12px;
  background:gold;
  color:black;
  font-size:11px;
  padding:4px 8px;
  border-radius:8px;
  font-weight:bold;
}

.foto-lider{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid gold;
  box-shadow:0 0 12px gold;
}

/* BOTÃO MÚSICA */
#musicToggle{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#b00000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
#musicToggle.active{
  background:#0bb300;
}
#musicIcon{
  font-size:26px;
}

/* WHATSAPP */
#whatsapp-float{
  position:fixed;
  bottom:20px;
  right:100px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:gold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  z-index:9999;
}

/* AJUDA */
.ajuda-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20000;
}
.ajuda-box{
  background:#111;
  border:2px solid gold;
  border-radius:16px;
  padding:22px;
  width:90%;
  max-width:340px;
}
.ajuda-box h3{ color:gold; }
.ajuda-box p{ color:#ddd; }
</style>
</head>

<body>

<button id="musicToggle"><span id="musicIcon">🎵</span></button>
<a id="whatsapp-float" href="https://wa.me/5583996469538" target="_blank">💬</a>

<div class="ajuda-overlay" id="ajuda">
  <div class="ajuda-box">
    <h3>Ajuda rápida</h3>
    <p>🎵 Botão da música liga/desliga o som.</p>
    <p>💬 Botão do WhatsApp fala comigo.</p>
    <button onclick="fecharAjuda()">Entendi</button>
  </div>
</div>

<div class="container">

<img class="foto" src="minha-foto.jpg">
<h1>PROJETO 18 –<br>MAIORIDADE</h1>

<div class="texto">
Mesmo que você esteja longe e não possamos comemorar juntos,
sua presença ainda pode fazer parte desse momento tão especial 💛
</div>

<div class="card">
<div id="contador"></div>
</div>

</div>

<script>
/* PARTÍCULAS */
for(let i=0;i<25;i++){
  const p=document.createElement("div");
  p.className="particula";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDelay=Math.random()*10+"s";
  document.body.appendChild(p);
}

/* CONTADOR */
const aniversario=new Date("2026-07-22").getTime();
setInterval(()=>{
  const d=aniversario-new Date().getTime();
  document.getElementById("contador").innerHTML =
    d<=0?"🎉 CHEGOU!":
    Math.floor(d/86400000)+" dias";
},1000);

/* MÚSICA */
const musica=new Audio("musica.mp3");
musica.loop=true;
let tocando=false;
musicToggle.onclick=()=>{
  tocando?musica.pause():musica.play();
  musicToggle.classList.toggle("active");
  musicIcon.textContent=tocando?"🎵":"🔊";
  tocando=!tocando;
};

/* AJUDA */
function fecharAjuda(){
  ajuda.style.display="none";
  localStorage.setItem("ajudaVista","1");
}
window.onload=()=>{
  if(!localStorage.getItem("ajudaVista")){
    ajuda.style.display="flex";
  }
};
</script>

</body>
</html>
